app-id: io.github.kotxku.AMADORA
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
branch: desktop
command: amadora
# Ubuntu 22.04's flatpak-builder runs appstream-compose, which current SDKs no longer ship
appstream-compose: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
modules:
  - name: amadora
    buildsystem: simple
    build-commands:
      - install -Dm755 pandora_launcher /app/bin/amadora
      - install -Dm644 io.github.kotxku.AMADORA.desktop /app/share/applications/io.github.kotxku.AMADORA.desktop
      - install -Dm644 io.github.kotxku.AMADORA.metainfo.xml /app/share/metainfo/io.github.kotxku.AMADORA.metainfo.xml
      - install -Dm644 icon_256x256.png /app/share/icons/hicolor/256x256/apps/io.github.kotxku.AMADORA.png
      # Horizon's release folder (build-horizon.sh), found by AMADORA at /app/lib/amadora/horizon
      - mkdir -p /app/lib/amadora && cp -R horizon /app/lib/amadora/horizon
    sources:
      - type: dir
        path: ../../target/horizon
        dest: horizon
      - type: file
        path: ../../target/x86_64-unknown-linux-gnu/release/pandora_launcher
      - type: file
        path: io.github.kotxku.AMADORA.desktop
      - type: file
        path: io.github.kotxku.AMADORA.metainfo.xml
      - type: file
        path: ../amadora_icons/icon_256x256.png
