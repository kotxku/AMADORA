app-id: io.github.kotxku.AMADORA
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
branch: desktop
command: amadora
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
modules:
  - name: amadora
    buildsystem: simple
    build-commands:
      - install -Dm755 pandora_launcher /app/bin/amadora
      - install -Dm644 amadora.desktop /app/share/applications/io.github.kotxku.AMADORA.desktop
      - install -Dm644 amadora.png /app/share/icons/hicolor/256x256/apps/amadora.png
    sources:
      - type: file
        path: ../../target/x86_64-unknown-linux-gnu/release/pandora_launcher
      - type: file
        path: ../../AppDir/usr/share/applications/amadora.desktop
      - type: file
        path: ../amadora_icons/icon_256x256.png
        dest-filename: amadora.png
